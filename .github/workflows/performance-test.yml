name: k6 Performance Testing Pipeline (Windows Self-Hosted)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & Start API Server
        shell: powershell
        run: |
          npm install
          
          # Start Node.js server in the background on Windows
          $server = Start-Process -FilePath "node" -ArgumentList "src/server.js" -PassThru -WindowStyle Hidden
          "SERVER_PID=$($server.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Waiting for API server to launch..."
          for ($i = 1; $i -le 15; $i++) {
            try {
              $res = Invoke-RestMethod -Uri "http://localhost:3000/api/health" -ErrorAction Stop
              if ($res.status -eq "ok") {
                Write-Host "API Server is up and running!"
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

      - name: Run k6 Load Test
        shell: powershell
        run: k6 run --summary-export=k6-summary.json tests/load-test.js
        env:
          BASE_URL: http://localhost:3000

      - name: Stop Local API Server
        if: always()
        shell: powershell
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
            Write-Host "Stopped Node.js server (PID: $env:SERVER_PID)"
          }

      - name: Upload k6 Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: k6-summary.json
