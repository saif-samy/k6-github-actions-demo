name: k6 Performance Testing Pipeline (Git Bash on Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Force all steps to use Git Bash instead of PowerShell on Windows
defaults:
  run:
    shell: bash

jobs:
  load-test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & Start API Server
        run: |
          npm install
          nohup npm start > server.log 2>&1 &
          
          echo "Waiting for API server to launch..."
          for i in {1..15}; do
            if curl -s http://localhost:3000/api/health | grep -q "ok"; then
              echo "API Server is up and running!"
              break
            fi
            sleep 1
          done

      - name: Run k6 Load Test
        run: k6 run --summary-export=k6-summary.json tests/load-test.js
        env:
          BASE_URL: http://localhost:3000

      - name: Stop Local API Server
        if: always()
        run: |
          # Stop Node.js server on Windows via taskkill
          taskkill //F //IM node.exe //T || true

      - name: Upload k6 Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: k6-summary.json
